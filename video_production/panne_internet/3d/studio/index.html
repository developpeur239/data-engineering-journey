<style>

.numv{font-size:200px;font-weight:700;line-height:1;letter-spacing:-.04em;color:#f2f4f5}
.numv.acc{color:#f5a524;text-shadow:0 0 40px rgba(245,165,36,.35)}.numv.acc2{color:#ff5a5f;text-shadow:0 0 40px rgba(255,90,95,.35)}

.brow{display:flex;justify-content:space-between;width:1280px}.blab{font-size:20px;color:#c6ccd0}.bval{font-size:40px;font-weight:700;margin-top:-14px}

.card .ck{font-size:15px;color:#f5a524}.card .ct{font-size:34px;font-weight:800;margin-top:8px;line-height:1.1}.card .cd{font-size:15px;color:#9aa3a8;margin-top:10px;letter-spacing:.1em}
.rcard{width:340px;padding:22px 24px}.rcard.wide{width:720px}.rcard .ct{font-size:30px}.rcard.wide .ct{font-size:40px}

.simhead{left:150px;top:420px;font-size:16px;color:#9aa3a8}
.simline{left:150px;font-size:48px;font-weight:800;letter-spacing:-.01em}.simline em{font-style:normal;color:#ff5a5f}
.split{top:0;width:960px;height:1080px;display:flex;flex-direction:column;justify-content:center;padding-left:110px;box-sizing:border-box}
.sbig{font-size:110px;font-weight:800;letter-spacing:-.02em}.sbig.c{color:#5fd4dc}.sbig.r{color:#ff5a5f}.split .cd{font-size:20px;color:#c6ccd0;margin-bottom:14px}
.tcenter{left:0;width:1920px;top:400px;text-align:center}.tbig{font-size:120px;font-weight:800;letter-spacing:-.025em}.tsub{font-size:22px;color:#f5a524;margin-top:20px}
.tcenter.q .tbig{font-size:96px}
.cursor{left:1500px;top:440px;width:10px;height:100px;background:#f5a524}
#grade,#grain{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none;transform-origin:0 0}
#grade{mix-blend-mode:soft-light}#grain{mix-blend-mode:overlay;opacity:.07}
</style></head>
<body>
<div id="stage">
  <canvas id="g2d"></canvas>
  <div id="grade"></div>
  <canvas id="grain" width="480" height="270"></canvas>
  <div id="hud"></div>
</div>
<script type="importmap">{"imports":{"three":"/assets/vendor/three.module.min.js"}}</script>
<script type="module">
import { THREE, renderer, scene, camera, W, H, place, shake, sstep, clamp, reseed, rnd } from "./core.js";
import * as places from "./places.js";
import * as dev from "./devices.js";
import * as gfx from "./graphics.js";

const stage = document.getElementById("stage"); stage.style.width = W + "px"; stage.style.height = H + "px";
stage.prepend(renderer.domElement);
const sc = W / 1920;
for (const id of ["g2d", "hud", "grade"]) document.getElementById(id).style.transform = `scale(${sc})`;
const grainC = document.getElementById("grain"); grainC.style.width = W + "px"; grainC.style.height = H + "px";
const gctx = grainC.getContext("2d");

// typographie française : espaces fines insécables avant ? ! : ; et entre les milliers
const typo = (s) => String(s).replace(/\s([?!:;])/g, " $1").replace(/«\s?/g, "« ").replace(/\s?»/g, " »");

// grade colorimétrique par temps du récit (froid → tension rouge → chaleur du retour)
const GRADE = { 1: ["#3a5a7a", 0.10], 2: ["#202830", 0.0], 3: ["#3a6a8a", 0.10], 4: ["#6a5a3a", 0.06], 5: ["#2a4a7a", 0.16], 6: ["#7a2a2a", 0.14], 7: ["#3a4a5a", 0.06], 8: ["#ffa050", 0.22], 9: ["#2a3a4a", 0.06] };

let S = null, upd3d = null, upd2d = null, H0 = null, extra = [];
window.init = async (scn) => {
  S = scn; reseed(S.n * 101 + 7);
  S.p = S.p || {}; S.onscreen = typo(S.onscreen); if (S.p.status) S.p.status = typo(S.p.status);
  const norm = (w) => w.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]/g, "");
  // instant (en s, dans la scène) du premier mot qui correspond, sinon valeur de repli
  S.at = (re, fb) => { const w = (S.words || []).find((x) => re.test(x.w) || re.test(norm(x.w))); return w ? w.a : fb; };
  S.atEnd = (re, fb) => { const w = (S.words || []).find((x) => re.test(x.w) || re.test(norm(x.w))); return w ? w.b : fb; };
  const n = S.n, k = S.kind, p = S.p;
  // ---- décor 3D ----
  const T = {
    1: () => places.apartment(S, "morning"), 2: () => places.metro(S, "refuse"), 20: () => places.metro(S, "coins"), 22: () => places.metro(S, "stuck"),
    32: () => places.pharmacy(S), 35: () => places.stairwell(S), 36: () => places.apartment(S, "neighbor"), 41: () => places.street(S),
    54: () => places.apartment(S, "day3"), 55: () => places.apartment(S, "radio"), 63: () => places.apartment(S, "cash"),
    5: () => dev.chrono(S), 6: () => dev.monitors(S), 7: () => dev.airport(S), 44: () => dev.warehouse(S), 45: () => dev.shelves(S),
  }[n];
  const byWhat = { phone: dev.phone, terminal: dev.terminal, atm: dev.atm, servers: dev.servers, computer: dev.computer, notebook: dev.notebook, ticket: (s) => places.metro(s, "refuse"), cash: (s) => places.apartment(s, "cash"), radio: (s) => places.apartment(s, "radio"),
    board: dev.airport, warehouse: dev.warehouse, shelves: dev.shelves };
  if (T) upd3d = await T();
  else if (k === "globe") upd3d = await dev.globe(S);
  else if (k === "device" && byWhat[p.what]) upd3d = await byWhat[p.what](S);
  else upd3d = dev.backdrop(S);
  // ---- couche graphique ----
  H0 = gfx.commonHud(S);
  if (k === "number") upd2d = gfx.numberKind(S);
  else if (k === "bars") upd2d = gfx.barsKind(S);
  else if (k === "circles") upd2d = gfx.circlesKind(S);
  else if (k === "choice") upd2d = gfx.choiceKind(S);
  else if (k === "list") upd2d = gfx.listKind(S);
  else if (k === "title") upd2d = gfx.titleKind(S);
  else if (k === "map") upd2d = gfx.mapKind(S, await gfx.loadGeo());
  else {
    // scènes 3D : titre en bas à gauche, apparition calée sur le mot qui le reprend
    const big = S.onscreen.split(" · ").length > 1 && n !== 2 ? S.onscreen.split(" · ")[0] : S.onscreen;
    const rest = S.onscreen.split(" · ").length > 1 && n !== 2 ? S.onscreen.split(" · ").slice(1).join(" · ") : "";
    const sub = [rest, p.status && !S.onscreen.includes(p.status) ? p.status : ""].filter(Boolean).join(" · ");
    const col = p.bad ? "r" : p.good ? "c" : "o";
    const first = (S.onscreen.match(/[A-ZÀ-Ü]{4,}/) || [""])[0].toLowerCase();
    const tIn = Math.max(0.35, (first ? S.at(new RegExp("^" + first.slice(0, 5)), null) : null) ?? (S.spans[0] || [0.3])[0] + 0.25);
    if (n !== 1) { const lt = gfx.lowerTitle(S, big, sub, col); extra.push((t) => lt(t, tIn)); }
  }
  // ---- éléments propres à certaines scènes ----
  if (n === 1) {
    const tP = gfx.lowerTitle(S, "PARIS", "Mardi · décembre · 48.86°N 2.35°E"), tM = gfx.lowerTitle(S, "MARC, 34", "Paris 11e · un fils de deux ans", "");
    const clock = gfx.el(`<div class="lbl caps">Heure locale · Paris</div><div class="v mono">07:45</div>`, "clock");
    const cnt = gfx.el(`<div class="lbl caps">Crèche dans</div><div class="v mono">00:15:00</div>`, "count");
    const sp = S.spans;
    extra.push((t) => { tP(t, sp[0][0] + 0.2, sp[1][0]); tM(t, S.at(/^marc$/i, sp[1][0]), sp[3][0] - 0.1);
      gfx.reveal(clock, t, S.at(/^sept$/i, sp[0][0] + 1.4), S.dur + 1); gfx.reveal(cnt, t, S.at(/^cr[eè]che$/i, sp[3][0]) - 0.1, S.dur + 1);
      const left = Math.max(0, 15 * 60 - t); cnt.querySelector(".v").textContent = `00:${String(Math.floor(left / 60)).padStart(2, "0")}:${String(Math.floor(left % 60)).padStart(2, "0")}`; });
  }
  if (n === 2) {
    const pw = gfx.pin3d("ÉLECTRICITÉ · OK", "ok"), da = gfx.pin3d("DONNÉES · 0", "bad");
    extra.push((t, ctx) => { if (!ctx.project) return; const v1 = ctx.project.ceiling.clone().project(camera), v2 = ctx.project.screen.clone().project(camera);
      pw(t, S.at(/lumi/i, S.spans[2][0]) + 0.1, S.dur + 1, (v1.x + 1) / 2 * 1920, (1 - v1.y) / 2 * 1080);
      da(t, S.at(/donn/i, S.spans[2][0] + 1.3), S.dur + 1, (v2.x + 1) / 2 * 1920, (1 - v2.y) / 2 * 1080); });
  }
  if (k === "number" || k === "bars" || k === "list" || k === "title" || k === "choice" || k === "circles") {
    // voile sombre : les chiffres et les titres restent lisibles sur le décor
    const dim = gfx.el("", "", `left:0;top:0;width:1920px;height:1080px;background:linear-gradient(90deg,rgba(6,8,10,.88) 0%,rgba(6,8,10,${n === 6 ? 0.55 : 0.75}) 60%,rgba(6,8,10,.6) 100%)`);
    document.getElementById("hud").prepend(dim); extra.push((t) => { dim.style.opacity = 1; });
  }
  const [gc, ga] = S.warm ? ["#ffa050", 0.24] : GRADE[S.beat] || ["#000", 0];
  document.getElementById("grade").style.background = gc; document.getElementById("grade").style.opacity = ga;
  await document.fonts.ready;
  return true;
};

window.renderAt = (t) => {
  const ctx = upd3d(t) || {};
  const [sh, roll] = shake(t, S.impacts || []);
  place(ctx.pos.clone().add(sh), ctx.tgt, roll, ctx.fov || 38);
  renderer.render(scene, camera);
  if (upd2d) upd2d(t);
  gfx.updateCommon(H0, S, t);
  for (const f of extra) f(t, ctx);
  // grain animé (déterministe : graine = numéro d'image)
  reseed(Math.floor(t * 24) + 1); const img = gctx.createImageData(480, 270);
  for (let i = 0; i < img.data.length; i += 4) { const v = rnd() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  gctx.putImageData(img, 0, 0);
  // transitions « filé » entre deux plans d'un même temps : flou directionnel calé sur le souffle
  const cv = renderer.domElement, d = S.dur, wi = S.whipIn ? 1 - sstep(0, 0.2, t) : 0, wo = S.whipOut ? sstep(d - 0.2, d, t) : 0, k2 = Math.max(wi, wo);
  cv.style.filter = k2 > 0.01 ? `blur(${(k2 * 14).toFixed(1)}px)` : "none";
  cv.style.transform = k2 > 0.01 ? `translateX(${((wo - wi) * -90 * sc).toFixed(1)}px) scale(${1 + k2 * 0.04})` : "none";
};
window.ready = true;
</script>
</body></html>
