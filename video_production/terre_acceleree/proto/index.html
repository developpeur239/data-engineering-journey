<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Prototype · La Terre accélère</title>
<style>
  @font-face { font-family: Serif4; src: url(node_modules/@fontsource/source-serif-4/files/source-serif-4-latin-300-normal.woff2); font-weight: 300; }
  @font-face { font-family: Serif4; src: url(node_modules/@fontsource/source-serif-4/files/source-serif-4-latin-400-italic.woff2); font-style: italic; }
  @font-face { font-family: InterW; src: url(node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2); font-weight: 500; }
  @font-face { font-family: InterW; src: url(node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2); font-weight: 600; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  canvas { display: block; }
  /* compteur : posé sur le haut du ciel (cadrage). Voile léger et bleuté, ancré dans le coin, sans désaturation. */
  .voile { position: absolute; z-index: 1; pointer-events: none; background: rgba(4,18,42,.6); }
  #voileHaut { left: 0; top: 0; width: 1100px; height: 640px;
    -webkit-mask-image: radial-gradient(ellipse 100% 100% at 0 0, #000 0%, rgba(0,0,0,.85) 45%, rgba(0,0,0,.35) 75%, transparent 100%);
    mask-image: radial-gradient(ellipse 100% 100% at 0 0, #000 0%, rgba(0,0,0,.85) 45%, rgba(0,0,0,.35) 75%, transparent 100%); }
  /* sous-titre : ovale sombre qui épouse la phrase (validé) */
  #sous span { display: inline-block; padding: 44px 150px;
               background: radial-gradient(closest-side, rgba(0,0,0,.68) 0%, rgba(0,0,0,.5) 50%, rgba(0,0,0,0) 100%); }
  #hud { position: absolute; z-index: 2; left: 96px; top: 64px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.4), 0 2px 18px rgba(0,0,0,.3); }
  #hud .lab { font: 600 21px InterW; letter-spacing: .26em; opacity: .92; }
  #hud .big { font: 300 108px Serif4; line-height: 1; margin: 6px 0 30px; letter-spacing: -.01em; }
  #hud .ln { font: 600 20px InterW; letter-spacing: .2em; margin-top: 11px; }
  #hud .or { color: #ffbf73; opacity: 1; text-shadow: 0 1px 2px rgba(0,0,0,.6), 0 2px 14px rgba(0,0,0,.45); }
  #sous { position: absolute; z-index: 2; left: 0; right: 0; bottom: 42px; text-align: center; color: #fff;
          font: italic 400 44px Serif4; text-shadow: 0 1px 3px rgba(0,0,0,.5), 0 2px 20px rgba(0,0,0,.6); transition: none; }
</style>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js",
               "three/addons/": "./node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<div class="voile" id="voileHaut"></div>
<div id="hud">
  <div class="lab">UNE JOURNÉE DURE</div>
  <div class="big" id="jour">24 h 00 min</div>
  <div class="ln" id="poids">VOUS PESEZ 75,00 KG</div>
  <div class="ln">NICE · 43,7° NORD</div>
  <div class="ln or" id="mer">LA MER EST À SON NIVEAU</div>
</div>
<div id="sous"></div>
<script type="module" src="scene.js"></script>
</body>
</html>
