// ---------- montage : les plans dans l'ordre (temps en secondes) ----------
const C = calern(), SP = space(), B = beach();
const look = (p, tg, fov = 36) => { camera.position.copy(p); camera.fov = fov; camera.updateProjectionMatrix(); camera.lookAt(tg); };
const leaHead = () => C.lea.head.getWorldPosition(V(0, 0, 0));
const ANG = 2.35, DOOR = V(Math.cos(ANG) * 5.4, 0, Math.sin(ANG) * 5.4);
function renderAt(t) {
  TAG.style.display = t < 26 ? "block" : "none";
  if (t >= 26 && t < 30) { renderer.setClearColor(0x000000); renderer.clear(); return; }   // 4 s de noir absolu
  if (t < 22 || (t >= 30 && t < 34)) {
    const day = t >= 30; C.setDay(day); drawScreens(C, t, day); drawPhone(C, t);
    C.laser.material.opacity = day ? 0 : 0.35 + 0.5 * (Math.sin(t * 9) > 0.6 ? 1 : 0);
    // Léa : assise, de profil vers les écrans ; elle tourne la tête vers le collègue pour répondre
    let E = day ? EXPR.soulage : EXPR.normal, turn = 0;
    if (!day) { if (t > 4.6) E = mixE(EXPR.normal, EXPR.inquiet, ease((t - 4.6) / 0.6));
      if (t > 13.4) E = mixE(EXPR.inquiet, EXPR.resolu, ease((t - 13.4) / 1.2)); turn = ease((t - 16.6) / 0.8); }
    face(C.lea, day ? EXPR.normal : E, blinkAt(t, 1));
    C.lea.g.rotation.y = lerp(Math.PI / 2, -0.55, turn); C.lea.head.rotation.y = -0.25 * turn; C.lea.head.rotation.x = day ? 0.18 : 0.04 * Math.sin(t * 0.9);
    C.lea.g.updateWorldMatrix(true, true);
    const kb = V(1.55, 0.83, 0.55 + 0.12 * Math.sin(t * 13)), ph = C.phone.getWorldPosition(V(0, 0, 0)).add(V(0, 0.03, 0));
    const typing = !day && t > 10.6 && t < 13.7, typeDay = day;
    aim(C.lea.arms[1].p, typing ? ph.clone().add(V(0.02 * Math.sin(t * 20), 0, 0)) : kb, (typing || typeDay ? 0.95 : 0.55) * (1 - turn));
    aim(C.lea.arms[0].p, typeDay ? V(1.55, 0.83, 0.3 + 0.1 * Math.sin(t * 11)) : V(1.4, 0.6, 0.1), (typeDay ? 0.95 : 0.4) * (1 - turn));
    // collègue : à la porte, à contre-jour (nuit) ; il passe derrière Léa en souriant (jour)
    if (!day) { C.col.g.position.copy(DOOR); C.col.g.lookAt(C.lea.g.position.x, 0, C.lea.g.position.z); face(C.col, t < 14.4 ? EXPR.inquiet : EXPR.normal, blinkAt(t, 2)); walk(C.col, 0, 0); }
    else { const k = (t - 30) / 4; C.col.g.position.set(lerp(3.0, -1.5, k), 0, -0.9); C.col.g.rotation.y = -Math.PI / 2; walk(C.col, t * 7.5); face(C.col, EXPR.soulage, 0);
      C.col.head.rotation.y = -0.9 * ease((t - 31.2) / 0.5) * (1 - ease((t - 32.6) / 0.5)); }
    // caméra
    if (day) look(V(lerp(3.9, 3.6, (t - 30) / 4), 1.9, 3.6), V(0.6, 1.1, 0));
    else if (t < 3.6) { const k = ease(t / 3.6); look(V(lerp(3.5, 3.2, k), lerp(2.0, 1.9, k), lerp(4.0, 3.7, k)), V(0.9, 1.15, -0.2), 44); }
    else if (t < 6.0) look(V(2.7, 1.45, 1.9), V(DOOR.x, 1.2, DOOR.z), 30);
    else if (t < 7.6) { const k = ease((t - 6) / 1.6); look(V(lerp(2.0, 1.95, k), 1.32, lerp(2.1, 1.9, k)), leaHead().add(V(0, -0.08, 0)), 30); }
    else if (t < 14.4) { const k = ease((t - 7.6) / 6.8); const p = C.phone.getWorldPosition(V(0, 0, 0)); look(V(p.x - 0.02, p.y + lerp(0.34, 0.3, k), p.z + 0.13), p, 34); }
    else if (t < 17.0) look(V(2.3, 1.4, 1.5), V(DOOR.x, 1.25, DOOR.z), 24);
    else { const k = ease((t - 17) / 5); look(V(lerp(-0.9, -0.6, k), 1.25, lerp(2.2, 1.9, k)), leaHead().add(V(0, -0.1, 0)), 30); }
    renderer.render(C.scene, camera); return;
  }
  if (t < 26) {   // contact, montée de lumière, blanc
    const k = (t - 22) / 4;
    SP.moon.position.x = lerp(0.86, 0.66, ease(k * 1.2)); SP.earth.rotation.y = t * 0.05;
    const f = ease((t - 23.6) / 2.2); SP.flash.scale.setScalar(0.05 + 3.5 * f * f); SP.flash.material.opacity = Math.min(1, 0.25 + f);
    SP.plume.scale.setScalar(0.1 + 1.2 * ease((t - 22.4) / 2)); SP.plume.material.opacity = 0.5 * ease((t - 22.4) / 1);
    look(V(0.2, 0.15, lerp(4.6, 3.8, k)), V(0.25, 0.05, 0), 34); renderer.render(SP.scene, camera); return;
  }
  // plage : le garçon court vers l'eau avec son seau, sa mère le rejoint
  drawSea(B, t); const k = (t - 34);
  const kx = lerp(-0.2, 0.3, ease(k / 4.5)), kz = lerp(3.0, -0.6, ease(k / 4.5));
  B.kid.g.position.set(kx, 0, kz); B.kid.g.rotation.y = Math.PI; walk(B.kid, k * 10, k < 4.5 ? 0.7 : 0); face(B.kid, EXPR.soulage, blinkAt(t, 3));
  aim(B.kid.arms[0].p, B.kid.g.localToWorld(V(-0.5, 0.2, 0.1)), 0.18 + 0.1 * Math.sin(k * 10));
  const mk2 = ease((k - 2.2) / 5);
  B.mom.g.position.set(lerp(3.6, 1.4, mk2), 0, lerp(0.9, 0.0, mk2)); B.mom.g.rotation.y = lerp(-Math.PI / 2, Math.PI - 0.3, ease((k - 5.5) / 1.5)); walk(B.mom, k * 6, mk2 < 0.99 && k > 2.2 ? 0.45 : 0); face(B.mom, EXPR.soulage, blinkAt(t, 4));
  look(V(lerp(4.0, 3.6, ease(k / 9)), 1.25, lerp(4.8, 4.4, ease(k / 9))), V(0.3, 0.6, 0.4), 38);
  renderer.render(B.scene, camera);
}
window.renderAt = renderAt;
document.fonts.ready.then(() => { renderAt(+(Q.get("t") || 0)); window.ready = true; });
</script></body></html>
