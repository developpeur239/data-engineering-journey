<!doctype html>
<html><head><meta charset="utf-8">
<!-- Refonte des personnages : planche de validation sans décor (vue de face en haut, trois-quarts en bas).
     Silhouettes noires minimalistes, proportions compactes (adulte environ 4 têtes, enfant environ 3), buste galbé
     (profil tourné), membres effilés, mains à cinq doigts, petits yeux expressifs ; un ou deux signes distinctifs.
     Rendu : chars.html?w=1920 -->
<style>
@font-face{font-family:"Instrument Sans";src:url(fonts/InstrumentSans-Regular.ttf);font-weight:400}
@font-face{font-family:"Instrument Sans";src:url(fonts/InstrumentSans-Bold.ttf);font-weight:700}
html,body{margin:0;background:#ddd;overflow:hidden}canvas{display:block}
.lab{position:absolute;transform:translateX(-50%);font:700 1.15vw/1.2 "Instrument Sans",sans-serif;color:#2b2e33;text-align:center}
.lab small{display:block;font-weight:400;font-size:.8vw;color:#5d636b}
.row{position:absolute;left:2.2%;font:600 .9vw/1 "Instrument Sans",sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#6b7179}
</style>
<script type="importmap">{"imports":{"three":"https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js"}}</script>
</head><body>
<script type="module">
import * as THREE from "three";
const Q = new URLSearchParams(location.search);
const W = +(Q.get("w") || 1920), H = Math.round(W * 9 / 16);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);
const S = new THREE.Scene(); S.background = new THREE.Color(0xd9dadd);
const camera = new THREE.OrthographicCamera(-4.0, 4.0, 2.25, -2.25, 0.1, 50);   // vue orthographique : proportions jugées sans déformation
const V = (x, y, z) => new THREE.Vector3(x, y, z), V2 = (x, y) => new THREE.Vector2(x, y);
const mk = (g, m) => { const o = new THREE.Mesh(g, m); o.castShadow = o.receiveShadow = true; return o; };
const std = (c, r = 0.55, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: r, ...o });
const BLACK = std(0x16181c, 0.72);
// solide de révolution lissé à partir d'un profil (rayon, hauteur)
function lathe(prof, mat, seg = 40) { const c = new THREE.SplineCurve(prof.map(([r, y]) => V2(r, y))); return mk(new THREE.LatheGeometry(c.getPoints(48), seg), mat); }
// membre effilé : longueur L, rayons r0 (haut) → r1 (bas), petit renflement
const limb = (L, r0, r1, mat, bulge = 0.08) => lathe([[0.001, 0], [r1 * 0.9, 0.004], [r1, 0.02], [lerp(r1, r0, 0.5) * (1 + bulge), L * 0.5], [r0, L * 0.92], [r0 * 0.75, L * 0.99], [0.001, L]], mat, 24);
const lerp = (a, b, k) => a + (b - a) * k;

function hand(sx, mat) {   // paume, quatre doigts légèrement fléchis, pouce
  const h = new THREE.Group();
  const palm = mk(new THREE.SphereGeometry(0.034, 16, 12), mat); palm.scale.set(0.95, 1.15, 0.5); h.add(palm);
  for (let i = 0; i < 4; i++) { const f = mk(new THREE.CapsuleGeometry(0.0085, 0.032 - Math.abs(i - 1.5) * 0.004, 4, 8), mat);
    f.position.set((i - 1.5) * 0.017, -0.055, 0.004); f.rotation.x = 0.25; h.add(f); }
  const th = mk(new THREE.CapsuleGeometry(0.009, 0.026, 4, 8), mat); th.position.set(-sx * 0.03, -0.02, 0.014); th.rotation.set(0.4, 0, -sx * 0.7); h.add(th);
  return h;
}
// o : k (échelle de la tête), H (taille totale), wide, hair, hairCol, top (couleur d'un vêtement, facultatif), topLen, scarf, badge, glasses, bucket
function character(o) {
  const g = new THREE.Group(), hr = 0.2 * (o.k || 1);   // rayon de tête
  const legL = o.legL, torsoL = o.torsoL, w = o.wide || 1;
  const hipY = legL + 0.04;
  // jambes et pieds
  for (const sx of [-1, 1]) {
    const lg = limb(legL, 0.078 * w, 0.045 * w, BLACK, 0.04); lg.position.set(sx * 0.075 * w, 0.04, 0); g.add(lg);
    const ft = mk(new THREE.SphereGeometry(0.06 * w, 18, 12), BLACK); ft.scale.set(0.9, 0.55, 1.65); ft.position.set(sx * 0.078 * w, 0.034, 0.045); g.add(ft);
  }
  // buste galbé (bassin, taille, poitrine, épaules arrondies)
  const t = [[0.001, 0], [0.13 * w, 0.02], [0.165 * w, 0.1], [o.waist || 0.15 * w, 0.32 * torsoL / 0.6], [0.165 * w, 0.46 * torsoL / 0.6], [0.16 * w, 0.54 * torsoL / 0.6], [0.11 * w, torsoL * 0.98], [0.05, torsoL]];
  const torso = lathe(t, BLACK); torso.position.y = hipY - 0.04; torso.scale.z = 0.78; g.add(torso);
  if (o.top) { const tt = t.map(([r, y]) => [r * 1.04 + 0.004, y]).filter(([, y]) => y <= torsoL * (o.topTop || 0.9)); tt.unshift([0.001, -(o.topLen || 0)]);
    if (o.topLen) tt.splice(1, 0, [0.15 * w * (o.flare || 1), -o.topLen + 0.02], [0.16 * w, 0.02]);
    const cl = lathe(tt.concat([[0.05, torsoL * (o.topTop || 0.9)]]), std(o.top, 0.8)); cl.position.y = hipY - 0.04; cl.scale.z = 0.8; g.add(cl); }
  const neckY = hipY - 0.04 + torsoL;
  const neck = mk(new THREE.CylinderGeometry(0.045, 0.055, 0.09, 16), BLACK); neck.position.y = neckY + 0.02; g.add(neck);
  // tête
  const head = new THREE.Group(); head.position.y = neckY + 0.04 + hr * 1.02; g.add(head);
  const sk = mk(new THREE.SphereGeometry(hr, 40, 30), BLACK); sk.scale.set(0.97, 1.04, 0.95); head.add(sk);
  const HM = std(o.hairCol, 0.6);
  const hb = (x, y, z, sx, sy, sz, rx = 0, rz = 0) => { const b = mk(new THREE.SphereGeometry(hr, 32, 24), HM); b.position.set(x * hr, y * hr, z * hr); b.scale.set(sx, sy, sz); b.rotation.set(rx, 0, rz); head.add(b); return b; };
  if (o.hair === "bob") { hb(0, 0.12, -0.16, 1.08, 1.0, 1.0); hb(0, -0.2, -0.22, 1.1, 0.78, 0.92); hb(-0.2, 0.62, 0.55, 0.62, 0.24, 0.38, -0.55, 0.45); hb(0.32, 0.55, 0.5, 0.45, 0.2, 0.32, -0.55, -0.6); }
  if (o.hair === "long") { hb(0, 0.12, -0.15, 1.07, 1.0, 1.0); const d = hb(0, -0.75, -0.42, 0.98, 1.25, 0.6); for (const s of [-1, 1]) hb(s * 0.86, -0.42, 0.05, 0.22, 0.85, 0.34, 0, s * 0.06); hb(0.1, 0.62, 0.55, 0.8, 0.22, 0.36, -0.55, -0.25); }
  if (o.hair === "kid") { hb(0, 0.16, -0.12, 1.05, 0.95, 1.0); hb(0.05, 0.98, 0.15, 0.22, 0.14, 0.2, 0.3, -0.5); hb(-0.15, 0.66, 0.6, 0.5, 0.18, 0.3, -0.6, 0.3); }
  if (o.hair === "short") { hb(0, 0.2, -0.12, 1.04, 0.9, 1.0); hb(0, 0.62, 0.5, 0.75, 0.18, 0.34, -0.7, 0); }
  // petits yeux et sourcils
  for (const sx of [-1, 1]) {
    const e = mk(new THREE.SphereGeometry(hr * 0.15, 16, 12), std(0xf3f1ec, 0.3)); e.scale.set(0.8, 1.15, 0.35); e.position.set(sx * hr * 0.33, hr * 0.06, hr * 0.92); head.add(e);
    const p = mk(new THREE.SphereGeometry(hr * 0.06, 12, 8), std(0x050506, 0.3)); p.position.set(sx * hr * 0.32, hr * 0.03, hr * 0.965); head.add(p);
    const c = new THREE.QuadraticBezierCurve3(V(sx * hr * 0.17, hr * 0.33, hr * 0.94), V(sx * hr * 0.33, hr * 0.39, hr * 0.95), V(sx * hr * 0.5, hr * 0.32, hr * 0.84));
    head.add(mk(new THREE.TubeGeometry(c, 12, hr * 0.028, 6), std(o.browCol || o.hairCol, 0.5)));
  }
  if (o.glasses) for (const sx of [-1, 1]) { const f = mk(new THREE.TorusGeometry(hr * 0.22, hr * 0.022, 6, 24), std(0xc9ced4, 0.3, { metalness: 0.6 })); f.position.set(sx * hr * 0.33, hr * 0.06, hr * 0.97); head.add(f); }
  // bras : légèrement écartés, coude à peine fléchi
  for (const sx of [-1, 1]) {
    const sh = new THREE.Group(); sh.position.set(sx * 0.155 * w, neckY - 0.06, 0); sh.rotation.set(sx * 0.03, 0, sx * 0.07); g.add(sh);
    const SL = o.sleeve ? std(o.sleeve, 0.8) : (o.shortSleeve ? std(o.shortSleeve, 0.8) : BLACK);
    const up = limb(o.armL * 0.52, 0.052 * w, 0.044 * w, SL, 0.05); up.rotation.x = Math.PI; sh.add(up);
    const el = new THREE.Group(); el.position.y = -o.armL * 0.5; el.rotation.x = -0.22; sh.add(el);
    const lo = limb(o.armL * 0.48, 0.042 * w, 0.032 * w, o.sleeve ? SL : BLACK, 0.04); lo.rotation.x = Math.PI; el.add(lo);
    const hd = hand(sx, BLACK); hd.position.y = -o.armL * 0.5; hd.rotation.y = sx * 0.3; el.add(hd);
    if (o.bucket && sx === 1) { const b = new THREE.Group(); b.position.y = -0.1; hd.add(b);
      const pail = mk(new THREE.CylinderGeometry(0.085, 0.064, 0.12, 24), std(0xd2262a, 0.45)); pail.position.y = -0.06; b.add(pail);
      const bail = mk(new THREE.TorusGeometry(0.08, 0.005, 6, 24, Math.PI), std(0x2a2c30, 0.5)); b.add(bail); }
  }
  if (o.scarf) { const s = mk(new THREE.TorusGeometry(0.085, 0.026, 10, 28), std(o.scarf, 0.7)); s.rotation.x = Math.PI / 2; s.position.y = neckY + 0.0; g.add(s);
    const tl = mk(new THREE.BoxGeometry(0.05, 0.16, 0.018), std(o.scarf, 0.7)); tl.position.set(0.045, neckY - 0.09, 0.1); tl.rotation.set(0.15, 0, 0.12); g.add(tl); }
  if (o.badge) { const bd = mk(new THREE.BoxGeometry(0.05, 0.07, 0.006), std(0xeef1f4, 0.5)); bd.position.set(-0.07, neckY - 0.2, 0.13); bd.rotation.x = -0.2; g.add(bd);
    const st = mk(new THREE.BoxGeometry(0.05, 0.016, 0.007), std(0x2f6fd0, 0.5)); st.position.set(-0.07, neckY - 0.172, 0.131); st.rotation.x = -0.2; g.add(st); }
  head.rotation.z = (o.tilt ?? 0.04); torso.rotation.z = -0.015; g.userData.top = head.position.y + hr; return g;
}
// les quatre personnages (proportions en mètres ; adulte ≈ 4 têtes, enfant ≈ 3 têtes)
const CAST = [
  ["Léa", "astrophysicienne · cheveux cuivrés, écharpe jaune", { k: 1.22, legL: 0.5, torsoL: 0.5, armL: 0.5, waist: 0.128, hair: "bob", hairCol: 0x8a4a2a, browCol: 0x9a5a34, scarf: 0xe2a51e }],
  ["La mère", "cheveux longs châtains, manteau clair", { k: 1.2, legL: 0.52, torsoL: 0.51, armL: 0.51, waist: 0.13, sleeve: 0xcfc4b0, hair: "long", hairCol: 0x6a4129, top: 0xcfc4b0, topLen: 0.36, flare: 1.35, topTop: 0.92 }],
  ["Le garçon", "haut turquoise, seau rouge", { k: 1.08, legL: 0.27, torsoL: 0.32, armL: 0.31, wide: 0.8, shortSleeve: 0x1aa6a3, hair: "kid", hairCol: 0x5a3a22, top: 0x1aa6a3, topTop: 0.92, bucket: true }],
  ["Le collègue", "plus grand et plus large, lunettes, badge", { k: 1.2, legL: 0.55, torsoL: 0.55, armL: 0.54, wide: 1.18, hair: "short", hairCol: 0x2c241e, glasses: true, badge: true }],
];
const xs = [-2.75, -0.92, 0.8, 2.62];
const labels = [];
for (const row of [0, 1]) CAST.forEach(([name, sub, o], i) => {
  const c = character(o); c.position.set(xs[i], row ? -2.12 : 0.18, 0); c.rotation.y = row ? -0.68 : 0; S.add(c);
  if (row === 0) labels.push([name, sub, xs[i]]);
});
// sol neutre (deux bandes) et lumière douce de studio : rien ne masque les proportions
const floor = mk(new THREE.PlaneGeometry(20, 10), std(0xcfd0d3, 0.95)); floor.rotation.x = -Math.PI / 2; floor.position.y = 0.18; S.add(floor);
const floor2 = floor.clone(); floor2.position.y = -2.12; S.add(floor2);
S.add(new THREE.HemisphereLight(0xffffff, 0x9a9ca0, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(-3, 6, 7); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0004;
Object.assign(key.shadow.camera, { left: -6, right: 6, top: 4, bottom: -4 }); S.add(key);
const rim = new THREE.DirectionalLight(0xffffff, 1.4); rim.position.set(4, 3, -6); S.add(rim);
camera.position.set(0, 0.1, 12); camera.lookAt(0, 0.1, 0);
// étiquettes
const proj = (x, y) => { const v = V(x, y, 0).project(camera); return [(v.x + 1) / 2 * 100, (1 - v.y) / 2 * 100]; };
for (const [n, sub, x] of labels) { const [px, py] = proj(x, 2.3); const d = document.createElement("div"); d.className = "lab"; d.style.left = px + "%"; d.style.top = (py - 1.2) + "%";
  d.innerHTML = `${n}<small>${sub}</small>`; document.body.appendChild(d); }
for (const [txt, y] of [["De face", 2.0], ["Trois-quarts", -0.12]]) { const [, py] = proj(0, y); const d = document.createElement("div"); d.className = "row"; d.style.top = (py - 1) + "%"; d.textContent = txt; document.body.appendChild(d); }
document.fonts.ready.then(() => { renderer.render(S, camera); window.ready = true; });
</script></body></html>
